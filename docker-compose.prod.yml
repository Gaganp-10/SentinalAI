# Docker Compose — Production Stack with Hardened Caddy Reverse Proxy
#
# Production Security Features:
#   1. Caddy is the only service publishing ports to the internet (80 & 443).
#   2. Caddy, Backend, and Database communicate over segregated Docker networks:
#      - edge: internal communication between Caddy and Backend (and external egress for Backend).
#      - data: strict internal-only network between Backend and Database (internal: true, no internet).
#   3. Every container drops ALL Linux capabilities (least privilege).
#   4. no-new-privileges:true prevents privilege escalation attacks on all services.
#   5. Backend container runs with read-only root filesystem (tmpfs /tmp and writable uploads volume).
#   6. CPU, Memory, and PID limits are enforced on compute/database services.
#   7. Automated JSON-file log rotation (10MB x 3) prevents disk exhaustion.
#   8. Healthchecks with startup periods for orchestrated zero-downtime boots.
#   9. Strictly scoped environment variables with required variable interpolation (${VAR:?error}).
#  10. Distinct production volume namespaces (sentinel_prod_*).

services:

  # ─────────────────────────────────────────────────────────────────────────────
  # Caddy Reverse Proxy & TLS Termination
  # ─────────────────────────────────────────────────────────────────────────────
  caddy:
    build:
      context: .
      dockerfile: deploy/caddy/Dockerfile
      args:
        VITE_API_BASE_URL: ""
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
      TLS_INTERNAL: ${TLS_INTERNAL:-}
      ACME_CA: ${ACME_CA:-}
    command:
      - "sh"
      - "-c"
      - |
        if [ -n "$$TLS_INTERNAL" ] && [ "$$DOMAIN" != "localhost" ]; then
          echo "FATAL: TLS_INTERNAL is only permitted when DOMAIN=localhost. Refusing to start." >&2
          exit 1
        fi
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      edge:
        ipv4_address: 172.28.0.2
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8081/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 256m
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  # ─────────────────────────────────────────────────────────────────────────────
  # FastAPI Application Backend
  # ─────────────────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "8000"
    environment:
      ENV: production
      DOMAIN: ${DOMAIN:?DOMAIN is required}
      FRONTEND_URL: https://${DOMAIN:?DOMAIN is required}
      ALLOWED_ORIGINS: '["https://${DOMAIN:?DOMAIN is required}"]'
      DATABASE_URL: postgresql://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-security_scanner}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      POSTGRES_SERVER: ${POSTGRES_SERVER:-db}
      POSTGRES_DB: ${POSTGRES_DB:-security_scanner}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-smtp}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      PASSWORD_RESET_EXPIRE_MINUTES: ${PASSWORD_RESET_EXPIRE_MINUTES:-30}
      AI_PROVIDER: ${AI_PROVIDER:-template}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-false}
      MAX_PROJECTS_PER_USER: ${MAX_PROJECTS_PER_USER:-50}
      MAX_DAILY_UPLOADS_PER_USER: ${MAX_DAILY_UPLOADS_PER_USER:-100}
      MAX_DAILY_UPLOAD_MB_PER_USER: ${MAX_DAILY_UPLOAD_MB_PER_USER:-500}
      MAX_USER_STORAGE_MB: ${MAX_USER_STORAGE_MB:-500}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-120}
      SCAN_TIMEOUT_SECONDS: ${SCAN_TIMEOUT_SECONDS:-300}
      MAX_CONCURRENT_SCANS: ${MAX_CONCURRENT_SCANS:-2}
      MAX_AI_EXPLANATIONS_PER_SCAN: ${MAX_AI_EXPLANATIONS_PER_SCAN:-10}
      MAX_DAILY_COPILOT_CHATS_PER_USER: ${MAX_DAILY_COPILOT_CHATS_PER_USER:-50}
      GOOGLE_AUTH_ALLOWLIST: ${GOOGLE_AUTH_ALLOWLIST:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.28.0.2/32}
      HOME: /tmp
      XDG_CACHE_HOME: /tmp
      SEMGREP_USER_HOME: /tmp
      SEMGREP_SEND_METRICS: "off"
      PYTHONDONTWRITEBYTECODE: 1
    volumes:
      - uploads_data:/app/uploads:rw
    tmpfs:
      - /tmp:rw,size=256m,mode=1777
    read_only: true
    restart: unless-stopped
    networks:
      edge:
        ipv4_address: 172.28.0.3
      data:
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    cpus: 1.5
    mem_limit: 1536m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # ─────────────────────────────────────────────────────────────────────────────
  # PostgreSQL 15 Database (Internal Only - Strictly Scoped Environment)
  # ─────────────────────────────────────────────────────────────────────────────
  db:
    image: postgres:15.20-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-security_scanner}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    cpus: 1.0
    mem_limit: 1024m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      - SETGID
      - SETUID

networks:
  edge:
    name: sentinel_prod_edge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/24
  data:
    name: sentinel_prod_data
    internal: true

volumes:
  postgres_data:
    name: sentinel_prod_postgres_data
  uploads_data:
    name: sentinel_prod_uploads_data
  caddy_data:
    name: sentinel_prod_caddy_data
  caddy_config:
    name: sentinel_prod_caddy_config
