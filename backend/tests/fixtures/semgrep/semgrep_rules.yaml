rules:
  # ==========================================
  # PYTHON RULES
  # ==========================================
  - id: python-sqli
    patterns:
      - pattern-either:
          - pattern: $CURSOR.execute($QUERY + $VAL, ...)
          - pattern: $CURSOR.execute(f"...", ...)
          - pattern: $CURSOR.execute("..." % ($VAL, ...), ...)
          - pattern: $CURSOR.execute("...".format(...), ...)
    message: "Potential SQL Injection via dynamic query construction in execute()."
    languages: [python]
    severity: ERROR
    metadata:
      cwe: ["CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"]

  - id: python-subprocess-shell
    patterns:
      - pattern-either:
          - pattern: subprocess.call($CMD, ..., shell=True, ...)
          - pattern: subprocess.run($CMD, ..., shell=True, ...)
          - pattern: subprocess.Popen($CMD, ..., shell=True, ...)
          - pattern: subprocess.check_output($CMD, ..., shell=True, ...)
          - pattern: subprocess.check_call($CMD, ..., shell=True, ...)
    message: "subprocess call with shell=True detected. Vulnerable to command injection."
    languages: [python]
    severity: ERROR
    metadata:
      cwe: ["CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"]

  - id: python-pickle-loads
    patterns:
      - pattern-either:
          - pattern: pickle.loads($DATA, ...)
          - pattern: _pickle.loads($DATA, ...)
    message: "Insecure deserialization with pickle.loads() can execute arbitrary code."
    languages: [python]
    severity: ERROR
    metadata:
      cwe: ["CWE-502: Deserialization of Untrusted Data"]

  - id: python-hashlib-md5
    patterns:
      - pattern-either:
          - pattern: hashlib.md5($DATA, ...)
          - pattern: hashlib.sha1($DATA, ...)
    message: "Weak cryptographic hash function (MD5 or SHA1) detected."
    languages: [python]
    severity: WARNING
    metadata:
      cwe: ["CWE-328: Use of Weak Hash"]

  - id: python-eval
    patterns:
      - pattern-either:
          - pattern: eval($DATA, ...)
          - pattern: exec($DATA, ...)
    message: "Dangerous function execution (eval/exec) can execute arbitrary code."
    languages: [python]
    severity: ERROR
    metadata:
      cwe: ["CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code ('Eval Injection')"]

  # ==========================================
  # JAVASCRIPT / TYPESCRIPT RULES
  # ==========================================
  - id: js-eval
    patterns:
      - pattern: eval($X)
    message: "Use of eval() detected, which can lead to arbitrary code execution."
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      cwe: ["CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code ('Eval Injection')"]

  - id: js-hardcoded-secret
    pattern-regex: (?i)(password|secret|token|api_key|apikey|private_key)\s*[:=]\s*['"][^'"]{5,}['"]
    message: "Potential hardcoded credential or secret detected."
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      cwe: ["CWE-798: Use of Hard-coded Credentials"]

  - id: js-child-process-exec
    patterns:
      - pattern-either:
          - pattern: child_process.exec($CMD, ...)
          - pattern: exec($CMD, ...)
    message: "Execution of child process command can lead to command injection."
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      cwe: ["CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"]

  # ==========================================
  # JAVA RULES
  # ==========================================
  - id: java-command-injection
    patterns:
      - pattern-either:
          - pattern: Runtime.getRuntime().exec($CMD, ...)
          - pattern: new ProcessBuilder($CMD, ...)
    message: "Command execution via Runtime.exec or ProcessBuilder can lead to command injection."
    languages: [java]
    severity: ERROR
    metadata:
      cwe: ["CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"]

  - id: java-sql-injection
    patterns:
      - pattern-either:
          - pattern: $STMT.executeQuery($QUERY + $VAR, ...)
          - pattern: $STMT.executeUpdate($QUERY + $VAR, ...)
    message: "Concatenating unescaped inputs into SQL query strings can lead to SQL injection."
    languages: [java]
    severity: ERROR
    metadata:
      cwe: ["CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"]

  # ==========================================
  # C / C++ RULES
  # ==========================================
  - id: c-unsafe-strcpy
    patterns:
      - pattern: strcpy($DEST, $SRC)
    message: "Use of strcpy is vulnerable to buffer overflow. Use strncpy or safer bounds-checked alternatives."
    languages: [c]
    severity: WARNING
    metadata:
      cwe: ["CWE-120: Buffer Copy without Checking Size of Input"]

  - id: c-system-call
    patterns:
      - pattern: system($CMD)
    message: "Direct call to system() can lead to command injection."
    languages: [c]
    severity: ERROR
    metadata:
      cwe: ["CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"]

  # ==========================================
  # PHP RULES
  # ==========================================
  - id: php-eval
    patterns:
      - pattern: eval($CMD)
    message: "Direct execution of eval() in PHP allows arbitrary remote code execution."
    languages: [php]
    severity: ERROR
    metadata:
      cwe: ["CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code ('Eval Injection')"]

  - id: php-command-injection
    patterns:
      - pattern-either:
          - pattern: system($CMD, ...)
          - pattern: exec($CMD, ...)
          - pattern: shell_exec($CMD, ...)
          - pattern: passthru($CMD, ...)
    message: "Execution of shell commands in PHP can lead to command injection."
    languages: [php]
    severity: ERROR
    metadata:
      cwe: ["CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"]
