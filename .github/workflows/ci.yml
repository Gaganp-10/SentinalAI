name: SentinelAI CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend Tests & PostgreSql Integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15.20-alpine3.24
        env:
          POSTGRES_DB: security_scanner_test
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: testpassword123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev git curl

      - name: Install Semgrep CLI in dedicated venv
        run: |
          sudo python3 -m venv /opt/semgrep
          sudo chown -R "$USER:$USER" /opt/semgrep
          /opt/semgrep/bin/pip install --no-cache-dir --upgrade pip "setuptools>=78.1.1"
          /opt/semgrep/bin/pip install --no-cache-dir semgrep==1.183.0
          /opt/semgrep/bin/pip install --no-cache-dir "mcp==1.30.0" "wcmatch>=11.2"
          echo "/opt/semgrep/bin" >> "$GITHUB_PATH"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Test Suite
        env:
          ENV: test
          TESTING: "1"
          DATABASE_URL: postgresql://sentinel:testpassword123@localhost:5432/security_scanner_test
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: security_scanner_test
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: testpassword123
          SECRET_KEY: test-secret-key-minimum-32-characters-for-testing-purpose
        run: |
          pytest -v

  postgres-migration-smoke:
    name: Postgres Migration Smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15.20-alpine3.24
        env:
          POSTGRES_DB: security_scanner_smoke
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: testpassword123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev git curl

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Postgres Migration Smoke Test
        env:
          ENV: production
          DATABASE_URL: postgresql://sentinel:testpassword123@localhost:5432/security_scanner_smoke
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: security_scanner_smoke
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: testpassword123
          SECRET_KEY: test-secret-key-minimum-32-characters-for-testing-purpose
        run: |
          python - << 'EOF'
          import os
          import sys
          import asyncio
          from sqlalchemy import create_engine, inspect, text

          # In this non-test smoke execution, TESTING is unset so session.py binds to DATABASE_URL
          from backend.database.session import engine, Base
          from backend.database.migration import init_db_schema_and_migrations
          from backend.main import lifespan, app

          assert engine.url.drivername.startswith("postgresql"), f"Expected Postgres engine, got {engine.url.drivername}"

          print("=== (a) Start app lifespan against empty DB & verify idempotence ===")
          with engine.begin() as conn:
              conn.execute(text("DROP TABLE IF EXISTS scan_findings, scan_history, vulnerabilities, files, projects, password_reset_tokens, users CASCADE;"))

          async def run_lifespan():
              async with lifespan(app):
                  pass

          asyncio.run(run_lifespan())

          insp = inspect(engine)
          tables = set(insp.get_table_names())
          expected_tables = {"users", "projects", "files", "vulnerabilities", "scan_history", "scan_findings", "password_reset_tokens"}
          assert expected_tables.issubset(tables), f"Missing tables: {expected_tables - tables}"

          user_cols = {c["name"]: c for c in insp.get_columns("users")}
          assert "token_version" in user_cols, "users.token_version column missing"
          assert not user_cols["token_version"]["nullable"], "users.token_version must be NOT NULL"

          # Run init_db_schema_and_migrations a second time to assert idempotence
          init_db_schema_and_migrations(engine, base=Base)

          insp2 = inspect(engine)
          assert set(insp2.get_table_names()) == tables, "Table set changed after second migration run"
          print("Part (a) passed successfully.")

          print("=== (b) Restore v0.9.0 schema without token_version, migrate, assert backfill and NOT NULL ===")
          with engine.begin() as conn:
              conn.execute(text("DROP TABLE IF EXISTS scan_findings, scan_history, vulnerabilities, files, projects, password_reset_tokens, users CASCADE;"))
              conn.execute(text("""
                  CREATE TABLE users (
                      id UUID PRIMARY KEY,
                      username VARCHAR NOT NULL UNIQUE,
                      email VARCHAR NOT NULL UNIQUE,
                      hashed_password VARCHAR,
                      created_at TIMESTAMP WITHOUT TIME ZONE,
                      is_active BOOLEAN
                  );
                  INSERT INTO users (id, username, email, hashed_password, is_active)
                  VALUES ('a0000000-0000-0000-0000-000000000001', 'legacy_user', 'legacy@example.com', 'hashed', true);
              """))

          insp_legacy = inspect(engine)
          assert "token_version" not in [c["name"] for c in insp_legacy.get_columns("users")]

          # Run migration
          init_db_schema_and_migrations(engine, base=Base)

          insp_migrated = inspect(engine)
          migrated_cols = {c["name"]: c for c in insp_migrated.get_columns("users")}
          assert "token_version" in migrated_cols, "token_version was not added"
          assert not migrated_cols["token_version"]["nullable"], "token_version must be NOT NULL"

          with engine.connect() as conn:
              val = conn.execute(text("SELECT token_version FROM users WHERE username = 'legacy_user'")).scalar()
              assert val == 1, f"Expected backfilled token_version=1, got {val}"

          print("Part (b) passed successfully.")
          print("All Postgres migration smoke assertions verified.")
          EOF

  frontend-build-and-audit:
    name: Frontend Build & NPM Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 22
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          npm --prefix frontend ci

      - name: Build Frontend Application
        run: |
          npm --prefix frontend run build

      - name: Run NPM Audit (High & Critical)
        run: |
          npm --prefix frontend audit --omit=dev --audit-level=high

  security-scans:
    name: Security Scans (Pip-Audit, Gitleaks, Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Pip-Audit on Application Python Dependencies
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: backend/requirements.txt

      - name: Run Gitleaks Secret Scanner
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" -w /repo zricethezav/gitleaks:latest git --baseline-path=/repo/.gitleaks-baseline.json --redact --verbose

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Build Backend Docker Image
        run: |
          docker build -t sentinel-backend:local ./backend

      - name: Build Caddy Frontend Docker Image
        run: |
          docker build -t sentinel-caddy:local -f deploy/caddy/Dockerfile .

      - name: Build Postgres Docker Image
        run: |
          docker build -t sentinel-postgres:local ./deploy/postgres

      - name: Trivy Scan Backend Image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "sentinel-backend:local"
          format: "table"
          exit-code: "1"
          ignore-unfixed: "true"
          trivyignores: ".trivyignore.yaml"
          severity: "CRITICAL,HIGH"
          version: "v0.76.2"

      - name: Trivy Scan Caddy Image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "sentinel-caddy:local"
          format: "table"
          exit-code: "1"
          ignore-unfixed: "true"
          trivyignores: ".trivyignore.yaml"
          severity: "CRITICAL,HIGH"
          version: "v0.76.2"

      - name: Trivy Scan Postgres Image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "sentinel-postgres:local"
          format: "table"
          exit-code: "1"
          ignore-unfixed: "true"
          trivyignores: ".trivyignore.yaml"
          severity: "CRITICAL,HIGH"
          version: "v0.76.2"

      - name: Trivy Scan Upstream Caddy Image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "caddy:alpine"
          format: "table"
          exit-code: "0"
          ignore-unfixed: "true"
          severity: "CRITICAL,HIGH"
          version: "v0.76.2"

  semgrep-dep-audit:
    name: Pip-Audit Inside Backend Image (/opt/semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Build Backend Docker Image
        run: |
          docker build -t sentinel-backend:local ./backend

      - name: Run Pip-Audit Against /opt/semgrep Isolated Virtualenv
        # Audit transitive dependencies of isolated Semgrep CLI in /opt/semgrep via pip freeze.
        # Accepted advisories (MCP offline dependency; semgrep/commands/mcp.py):
        # CVE-2026-59951:  https://osv.dev/vulnerability/CVE-2026-59951  (expires 2026-12-31)
        # CVE-2026-116685: https://osv.dev/vulnerability/CVE-2026-116685 (expires 2026-12-31)
        # CVE-2026-116684: https://osv.dev/vulnerability/CVE-2026-116684 (expires 2026-12-31)
        # CVE-2026-116686: https://osv.dev/vulnerability/CVE-2026-116686 (expires 2026-12-31)
        # CVE-2026-114603: https://osv.dev/vulnerability/CVE-2026-114603 (expires 2026-12-31)
        # CVE-2026-126360: https://osv.dev/vulnerability/CVE-2026-126360 (expires 2026-12-31)
        run: |
          docker run --rm -u root sentinel-backend:local sh -c "
            pip install --no-cache-dir pip-audit && \
            /opt/semgrep/bin/pip freeze > /tmp/semgrep-reqs.txt && \
            pip-audit -r /tmp/semgrep-reqs.txt --no-deps --disable-pip \
              --ignore-vuln CVE-2026-59951 \
              --ignore-vuln CVE-2026-116685 \
              --ignore-vuln CVE-2026-116684 \
              --ignore-vuln CVE-2026-116686 \
              --ignore-vuln CVE-2026-114603 \
              --ignore-vuln CVE-2026-126360
          "
