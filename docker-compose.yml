# Docker Compose — Full Stack: Frontend + Backend + PostgreSQL
#
# Usage:
#   docker compose up --build     # first run / after code changes
#   docker compose up             # subsequent runs (data persists via volumes)
#   docker compose down           # stop and remove containers (data volumes kept)
#   docker compose down -v        # stop AND delete volumes (wipes DB data)

services:

  # ─────────────────────────────────────────────
  # PostgreSQL database
  # ─────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    # Single env source — DB credentials come from docker.env only.
    # No postgres:postgres default anywhere in compose.
    env_file:
      - docker.env
    # No ports: mapping — DB is only reachable inside the Docker network.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ─────────────────────────────────────────────
  # FastAPI backend
  # ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      # Host 8000 → container 8000 bound to loopback only (127.0.0.1)
      - "127.0.0.1:8000:8000"
    # Single env source — all secrets live in docker.env only.
    env_file:
      - docker.env
    volumes:
      # Named volume for high performance extraction (avoids Windows 9p bind mount latency)
      - uploads_data:/app/uploads
    depends_on:
      db:
        # Wait for Postgres to actually accept connections, not just start
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─────────────────────────────────────────────
  # React/Vite frontend (served by nginx)
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Empty string → same-origin requests through nginx /api/ proxy.
        # The browser never needs to know the backend container's internal address.
        VITE_API_BASE_URL: ""
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-1020864929554-v9mb9l065pedkr9ah01a1n3jsggfbc5c.apps.googleusercontent.com}
    ports:
      # Host 3000 → container nginx port 80. Matches local dev convention.
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  # Named volume for Postgres data — survives 'docker compose down'
  # Use 'docker compose down -v' to intentionally wipe it.
  postgres_data:
  uploads_data:

